<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — OSN Academy</title>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    body {
      background: var(--navy);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* ── Dekorasi latar ── */
    .bg-deco {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .bg-deco .circle-1 {
      position: absolute;
      width: 560px; height: 560px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(232,160,32,0.12), transparent 65%);
      top: -180px; right: -140px;
    }

    .bg-deco .circle-2 {
      position: absolute;
      width: 400px; height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(26,127,116,0.10), transparent 65%);
      bottom: -120px; left: -80px;
    }

    .bg-deco .circle-3 {
      position: absolute;
      width: 200px; height: 200px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(42,74,138,0.3), transparent 65%);
      top: 40%; left: 30%;
    }

    /* ── Login card ── */
    .login-wrap {
      position: relative;
      z-index: 1;
      width: 440px;
      max-width: 92vw;
      animation: fadeUp 0.5s ease forwards;
    }

    .login-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 24px;
      padding: 52px 48px 44px;
      backdrop-filter: blur(16px);
    }

    /* ── Logo ── */
    .login-logo {
      text-align: center;
      margin-bottom: 40px;
    }

    .login-logo .logo-icon {
      width: 56px; height: 56px;
      background: var(--gold);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      margin: 0 auto 16px;
      box-shadow: 0 8px 24px rgba(232,160,32,0.35);
    }

    .login-logo h1 {
      font-family: var(--font-display);
      font-size: 30px;
      color: var(--white);
      letter-spacing: -0.5px;
      line-height: 1.1;
    }

    .login-logo h1 span { color: var(--gold); }

    .login-logo p {
      font-size: 13px;
      color: rgba(255,255,255,0.4);
      margin-top: 8px;
      line-height: 1.5;
    }

    /* ── Form ── */
    .login-card .form-group label {
      color: rgba(255,255,255,0.5);
    }

    .login-card .form-group input {
      background: rgba(255,255,255,0.06);
      border-color: rgba(255,255,255,0.10);
      color: var(--white);
    }

    .login-card .form-group input:focus {
      border-color: var(--gold);
      background: rgba(232,160,32,0.08);
      box-shadow: 0 0 0 3px rgba(232,160,32,0.15);
    }

    .login-card .form-group input::placeholder {
      color: rgba(255,255,255,0.2);
    }

    .btn-login {
      width: 100%;
      background: var(--gold);
      color: var(--navy);
      border: none;
      border-radius: var(--radius-md);
      padding: 15px;
      font-family: var(--font-body);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition);
      margin-top: 4px;
      letter-spacing: 0.3px;
    }

    .btn-login:hover {
      background: var(--gold-light);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(232,160,32,0.4);
    }

    .btn-login:active { transform: translateY(0); }

    /* ── Error ── */
    .login-error {
      background: rgba(192,57,43,0.15);
      border: 1px solid rgba(192,57,43,0.35);
      border-radius: var(--radius-md);
      padding: 12px 16px;
      font-size: 13px;
      color: #ff9090;
      margin-bottom: 20px;
      display: none;
    }

    .login-error.show { display: block; }

    /* ── Password toggle ── */
    .input-password-wrap {
      position: relative;
    }

    .input-password-wrap input {
      width: 100%;
      padding-right: 46px;
    }

    .btn-toggle-pw {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      color: rgba(255,255,255,0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s ease;
      border-radius: 4px;
    }

    .btn-toggle-pw:hover { color: rgba(255,255,255,0.75); }

    /* ── Footer ── */
    .login-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: rgba(255,255,255,0.2);
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%       { transform: translateX(-8px); }
      40%       { transform: translateX(8px); }
      60%       { transform: translateX(-5px); }
      80%       { transform: translateX(5px); }
    }
  </style>
</head>
<body>

  <!-- Dekorasi latar -->
  <div class="bg-deco">
    <div class="circle-1"></div>
    <div class="circle-2"></div>
    <div class="circle-3"></div>
  </div>

  <!-- Login card -->
  <div class="login-wrap">
    <div class="login-card">

      <!-- Logo -->
      <div class="login-logo">
        <div class="logo-icon">🗺️</div>
        <h1>OSN <span>Academy</span></h1>
        <p>Platform Try Out Olimpiade Sains Nasional<br>Ilmu Pengetahuan Sosial — Sekolah Dasar</p>
      </div>

      <!-- Error message -->
      <div class="login-error" id="login-error">
        Username atau password salah. Silakan coba lagi.
      </div>

      <!-- Form -->
      <div class="form-group">
        <label>Username</label>
        <input
          type="text"
          id="input-username"
          placeholder="Masukkan username"
          autocomplete="off"
          autofocus
        >
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="input-password-wrap">
          <input
            type="password"
            id="input-password"
            placeholder="Masukkan password"
          >
          <button class="btn-toggle-pw" type="button" onclick="togglePassword()" title="Tampilkan/sembunyikan password">
            <svg id="icon-eye" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg id="icon-eye-off" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                 style="display:none">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
      </div>

      <button class="btn-login" onclick="doLogin()">
        Masuk →
      </button>



    </div>

    <div class="login-footer">
      © OSN Academy — Persiapan OSN IPS SD
    </div>
  </div>

  <!-- Scripts -->
  <script src="data/users.js"></script>
  <script src="assets/app.js"></script>
  <script>
    // Jika sudah login, langsung redirect
    (function() {
      const session = Auth.getSession();
      if (session) {
        redirect(session.role);
      }
    })();

    // Enter key support
    document.getElementById('input-password').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') doLogin();
    });
    document.getElementById('input-username').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') doLogin();
    });

    function togglePassword() {
      const input  = document.getElementById('input-password');
      const eyeOn  = document.getElementById('icon-eye');
      const eyeOff = document.getElementById('icon-eye-off');
      const isHidden = input.type === 'password';

      input.type        = isHidden ? 'text' : 'password';
      eyeOn.style.display  = isHidden ? 'none'  : '';
      eyeOff.style.display = isHidden ? ''      : 'none';
    }

    function doLogin() {
      const username = document.getElementById('input-username').value.trim();
      const password = document.getElementById('input-password').value;
      const errEl    = document.getElementById('login-error');

      if (!username || !password) {
        errEl.textContent = 'Username dan password tidak boleh kosong.';
        errEl.classList.add('show');
        return;
      }

      const user = cekLogin(username, password);

      if (!user) {
        errEl.textContent = 'Username atau password salah. Silakan coba lagi.';
        errEl.classList.add('show');
        const card = document.querySelector('.login-card');
        card.style.animation = 'shake 0.4s ease';
        setTimeout(() => card.style.animation = '', 400);
        return;
      }

      errEl.classList.remove('show');
      Auth.login(user.username, user.role, user.nama);
      redirect(user.role);
    }

    function redirect(role) {
      if (role === 'tentor') {
        window.location.href = 'dashboard-tentor.html';
      } else {
        window.location.href = 'dashboard-siswa.html';
      }
    }
  </script>

</body>
</html>
